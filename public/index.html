<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerBridge – Recruitment Management Portal</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#000000">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CareerBridge"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#0a0a0a;--g8:#262626;--g6:#404040;--g1:#efefef;--mint:#ffffff;--bg:#fafafa;--side:#f4f4f4;--beige:#e9e9e9;--card:#fff;--ink:#1d2622;--mut:#6b736e;--line:#e6e6e6;--red:#111111;--amber:#555555}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}.side{width:232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-weight:800;font-size:20px;color:var(--g9);padding:0 10px}.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#3c4741;cursor:pointer;font-weight:500}.nav:hover{background:#ececec}.nav.on{background:var(--beige);color:var(--g9);font-weight:700;box-shadow:inset -3px 0 0 var(--g9)}
.sec{font-size:10px;letter-spacing:.12em;color:var(--mut);margin:14px 12px 4px;font-weight:700}
.main{margin-left:232px;flex:1;min-width:0}.top{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:420px;position:relative}.search input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:#f1f1f1}
.drop{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;padding:6px;display:none}.drop a{display:block;padding:7px 10px;border-radius:6px}.drop a:hover{background:var(--bg)}
.page{padding:26px 28px;max-width:1280px}h1{font-size:28px;margin:0 0 4px;color:var(--g9);font-weight:800}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.dark{background:var(--g9);color:#ffffff;border:none}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.k{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700;text-transform:uppercase}.big{font-size:30px;font-weight:800;margin:6px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{background:#f2f2f2}.pri{background:var(--g9);color:#fff;border-color:var(--g9)}.pri:hover{background:var(--g8)}.tan{background:var(--beige);border-color:var(--beige)}
.btn:disabled{opacity:.55;cursor:wait}.post{margin-top:auto;padding:12px;text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:var(--g1);color:var(--g9)}
.st-applied{background:#f0f0f0;color:#222}.st-screening{background:#e4e4e4;color:#222}.st-shortlisted{background:#e9e9e9;color:#222}.st-interview{background:#e9e9e9;color:#222}.st-offer,.st-hired{background:#0a0a0a;color:#fff}.st-rejected{background:#ececec;color:#222}
.st-draft,.st-closed,.st-archived{background:#eee;color:#222}.st-paused{background:#eeeeee;color:#222}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px;border-bottom:1px solid var(--line);text-transform:uppercase}td{padding:11px 10px;border-bottom:1px solid #ededed}tr.click:hover td{background:#f7f7f7;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.mut{color:var(--mut)}.small{font-size:12px}
.bar{height:8px;background:#ebebeb;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--g9)}
.funnel .f{display:flex;align-items:center;gap:12px;margin:6px 0}.funnel .fb{height:40px;border-radius:8px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:600;min-width:120px}
input.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}label{font-size:12px;font-weight:700;color:#444;display:block;margin:10px 0 4px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g9);color:#fff;padding:12px 16px;border-radius:10px;z-index:60;max-width:380px}.toast.err{background:var(--red)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:3px 9px;margin:3px;font-size:12px;background:#fafafa}.chip.ok{border-color:#bdbdbd;background:#f2f2f2}.chip.no{border-color:#bdbdbd;background:#f5f5f5}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;max-width:80%}.msg.recruiter{background:var(--g1);margin-left:auto}.msg.candidate{background:#fff;border:1px solid var(--line)}.msg.system{background:transparent;color:var(--mut);font-size:12px;text-align:center;max-width:100%}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login .l{background:var(--g9);color:#ffffff;padding:60px;display:flex;flex-direction:column;justify-content:center}.login .r{display:flex;align-items:center;justify-content:center;padding:30px}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px}.spark i{flex:1;background:#dcdcdc;border-radius:3px}.spark i:last-child{background:var(--g9)}
.md h3{margin:12px 0 6px}.md ul{padding-left:18px}
#menuBtn,#installBtn{display:none}.shade{display:none}
@media(max-width:900px){.side{display:flex;transform:translateX(-100%);transition:transform .2s;z-index:40;width:260px;box-shadow:0 0 30px #0003}.side.open{transform:none}.shade.open{display:block;position:fixed;inset:0;background:#0005;z-index:30}
#menuBtn{display:inline-flex;font-size:22px;background:none;border:none;padding:4px 8px;cursor:pointer}.top{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}.top .small,.top a.row>div{display:none}.search{max-width:none;flex:1}.top>div[style*='flex:1']{display:none}.page{overflow-x:hidden}.card{overflow-wrap:anywhere}
h1{font-size:23px}.big{font-size:24px}table{display:block;overflow-x:auto;white-space:nowrap}.modal .card{max-height:85vh}.row.wrap>.in{width:100%!important}.main{margin-left:0}.g4,.g3,.g2,.g21,.login{grid-template-columns:1fr}.login .l{display:none}.page{padding:18px 16px}}

/* ---------- app polish ---------- */
.ic{width:18px;height:18px;flex:none}.nav .ic{opacity:.75}.nav.on .ic{opacity:1}
.btn{transition:transform .08s,background .15s}.btn:active{transform:scale(.97)}
.card{transition:box-shadow .2s}.card:hover{box-shadow:0 6px 24px #0000000d}
.page{animation:pageIn .28s ease}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#topbar{position:fixed;top:0;left:0;height:3px;background:#000;z-index:100;width:0;transition:width .3s,opacity .3s;opacity:0}
#topbar.go{opacity:1;width:70%}#topbar.done{width:100%;opacity:0}
.skel{padding:26px 28px}.skel div{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:12px;margin-bottom:14px}@keyframes sh{to{background-position:-200% 0}}
/* splash */
#splash{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .45s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo{width:96px;height:96px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#splash .logo svg{width:58px;height:58px}
#splash h1{color:#fff;font-size:30px;margin:22px 0 4px;letter-spacing:-.5px;animation:up .6s .25s both}#splash p{opacity:.6;margin:0;animation:up .6s .4s both}
#splash .dots{position:absolute;bottom:60px;display:flex;gap:6px}#splash .dots i{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}#splash .dots i:nth-child(2){animation-delay:.15s}#splash .dots i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes up{from{transform:translateY(14px);opacity:0}}@keyframes blink{50%{opacity:.25}}
/* onboarding */
#onb{position:fixed;inset:0;background:#fff;z-index:150;display:flex;flex-direction:column}
#onb .track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}#onb .track::-webkit-scrollbar{display:none}
#onb .sl{min-width:100%;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:center;padding:40px 32px;box-sizing:border-box}
#onb .art{width:200px;height:200px;border-radius:50%;background:#f2f2f2;margin:0 auto 40px;display:flex;align-items:center;justify-content:center}
#onb .art svg{width:90px;height:90px}#onb h2{font-size:28px;letter-spacing:-.5px;margin:0 0 10px}#onb p{color:#666;font-size:16px;line-height:1.55;margin:0}
#onb .foot{padding:20px 28px max(28px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
#onb .pg{display:flex;gap:6px;flex:1}#onb .pg i{height:6px;width:6px;border-radius:3px;background:#d4d4d4;transition:all .25s}#onb .pg i.on{width:22px;background:#000}
#onb .roles{display:grid;gap:12px;margin-top:24px}#onb .role{display:flex;align-items:center;gap:14px;border:1.5px solid #e5e5e5;border-radius:16px;padding:16px;cursor:pointer;text-align:left;background:#fff}
#onb .role:active{background:#f5f5f5}#onb .role b{display:block;font-size:16px}#onb .role span{color:#777;font-size:13px}#onb .role .ri{width:44px;height:44px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.big-btn{background:#000;color:#fff;border:none;border-radius:14px;padding:15px 22px;font-weight:700;font-size:15px;cursor:pointer}
/* bottom nav */
.bnav{display:none}
@media(max-width:900px){
 input.in,select.in,textarea.in{font-size:16px;padding:12px 13px;border-radius:12px}.btn{padding:10px 14px;border-radius:12px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e8e8e8;z-index:20;padding:6px 4px max(6px,env(safe-area-inset-bottom))}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#888;padding:4px 0;font-weight:600}.bnav a .ic{width:22px;height:22px}.bnav a.on{color:#000}
 .bnav a.on .ic{stroke-width:2.4}.main{padding-bottom:80px}.top{background:#fff}.page{padding:16px 14px}.card{border-radius:16px}
 .login{display:block;background:#fff}.login .l{display:flex!important;padding:56px 26px 80px;min-height:auto}.login .l h1{font-size:30px!important}.login .l p{font-size:15px!important;opacity:.75}
 .login .r{min-height:auto;padding:0 14px 30px;margin-top:-50px;display:block}.login .r .card{width:100%!important;box-shadow:0 10px 40px #0000001a;border:none;padding:22px}
 .g4{grid-template-columns:1fr 1fr!important}.grid[style*='repeat(6']{grid-template-columns:1fr 1fr 1fr!important}.card.row[style*='gap:6px']{display:grid;grid-template-columns:1fr 1fr;width:100%}.big{font-size:22px}.card{padding:15px}
 .toast{left:14px;right:14px;bottom:90px;max-width:none;text-align:center;border-radius:14px}.modal{align-items:flex-end;padding:0}.modal .card{border-radius:22px 22px 0 0;width:100%;animation:sheet .25s ease}
 @keyframes sheet{from{transform:translateY(40px);opacity:.5}}
}
details.signup{margin-top:14px}details.signup>summary{list-style:none;cursor:pointer;text-align:center;border:1.5px solid #111;border-radius:12px;padding:12px;font-size:14px;transition:background .15s}
details.signup>summary::-webkit-details-marker{display:none}details.signup>summary:hover{background:#f4f4f4}details.signup[open]>summary{background:#111;color:#fff;margin-bottom:6px}
details.signup[open]>form{animation:rise .3s ease both}
</style>
</head>
<body>
<div id="topbar"></div><div id="root"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STAGES = ['applied', 'screening', 'shortlisted', 'interview', 'offer', 'hired', 'rejected'];
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : '';
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtTime = (d) => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDT = (d) => `${fmtDate(d)}, ${fmtTime(d)}`;
const money = (n) => n ? '₹' + (n >= 100000 ? (n / 100000).toFixed(1).replace('.0', '') + 'L' : n.toLocaleString('en-IN')) : '—';
const initials = (n) => String(n || '?').split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const av = (n, c, s = 34, img) => img ? `<img class="av" src="${img}" alt="" style="width:${s}px;height:${s}px;object-fit:cover">` : `<span class="av" style="background:#111;width:${s}px;height:${s}px;font-size:${s / 2.6}px">${esc(initials(n))}</span>`;
const pill = (s) => `<span class="pill st-${s}">${esc(cap(s))}</span>`;
const ico = { dash: '▦', jobs: '💼', cand: '👥', int: '📅', msg: '💬', ana: '📈', rep: '📄', co: '🏢', rec: '🧑‍💼', bell: '🔔', set: '⚙️', help: '❓' };

let TOKEN = localStorage.getItem('cb_token'), ME = null;
async function api(path, opts = {}) {
  const headers = { ...(opts.body && !(opts.body instanceof FormData) ? { 'content-type': 'application/json' } : {}), ...(TOKEN ? { authorization: 'Bearer ' + TOKEN } : {}) };
  const res = await fetch('/api' + path, { ...opts, headers, body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith('/auth')) { logout(); throw new Error('Please sign in'); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3000); }
function go(p) { history.pushState({}, '', p); render(); }
window.onpopstate = render;
document.addEventListener('click', (e) => { const a = e.target.closest('a[data-go]'); if (a) { e.preventDefault(); go(a.getAttribute('href')); } });
function logout() { localStorage.removeItem('cb_token'); TOKEN = null; ME = null; go('/login'); }
async function busy(btn, fn) { const t = btn.textContent; btn.disabled = true; btn.textContent = '⏳ Working…'; try { await fn(); } catch (e) { toast(e.message, 1); } finally { btn.disabled = false; btn.textContent = t; } }
function modal(html, onMount) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; m.onclick = (e) => { if (e.target === m) m.remove(); }; document.body.appendChild(m); onMount && onMount(m); return m; }

const NAV = [['/', 'dash', 'Dashboard'], ['/jobs', 'jobs', 'Jobs'], ['/candidates', 'cand', 'Candidates'], ['/interviews', 'int', 'Interviews'], ['/messages', 'msg', 'Messaging'], ['/analytics', 'ana', 'Analytics'], ['/reports', 'rep', 'Reports'],
  null, ['/company', 'co', 'Company'], ['/recruiters', 'rec', 'Recruiters'], ['/notifications', 'bell', 'Notifications'], ['/settings', 'set', 'Settings']];

function shell(active, body) {
  return `<div class="app"><aside class="side"><div class="brand" style="display:flex;gap:10px;align-items:center"><span style="width:34px;height:34px;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center">${I('logo','style="stroke:#fff"')}</span><span>CareerBridge<small>Employer Portal</small></span></div><div style="height:18px"></div>
  ${NAV.map((n) => n ? `<a data-go href="${n[0]}" class="nav ${active === n[0] ? 'on' : ''}"><span>${ico[n[1]]}</span>${n[2]}</a>` : '<div class="sec">ORGANIZATION</div>').join('')}
  <div style="height:12px"></div><a data-go href="/help" class="nav ${active === '/help' ? 'on' : ''}">${ico.help} Help Center</a><a class="nav" style="color:var(--red)" onclick="logout()">${I('out')} Log Out</a>
  <a data-go href="/jobs/new" class="btn pri post">＋ Post a New Job</a></aside>
  <div class="shade" onclick="toggleMenu(false)"></div><div class="main"><div class="top"><button id="menuBtn" onclick="toggleMenu()" aria-label="Menu">☰</button><div class="search"><input id="gs" placeholder="Search candidates, jobs…" autocomplete="off"><div class="drop" id="gsd"></div></div><div style="flex:1"></div>
  <button id="installBtn" class="btn pri small" onclick="installApp()">⬇ Install app</button><a data-go href="/notifications" title="Notifications">${I('bell')}</a><a data-go href="/profile" class="row"><div style="text-align:right"><b>${esc(ME.user.name)}</b><div class="small mut">${esc(ME.user.title || '')} · ${esc(ME.company.name)}</div></div>${av(ME.user.name, '#0a0a0a', 36, ME.user.avatar_url)}</a></div>
  <div class="page" id="page">${body}</div></div>${bnav([['/', 'dash', 'Home'], ['/jobs', 'jobs', 'Jobs'], ['/candidates', 'cand', 'Candidates'], ['/interviews', 'int', 'Interviews'], ['/messages', 'msg', 'Inbox']], active)}</div>`;
}
function bindSearch() {
  const i = $('#gs'), d = $('#gsd'); if (!i) return; let t;
  i.oninput = () => { clearTimeout(t); t = setTimeout(async () => { if (!i.value.trim()) return d.style.display = 'none'; const r = await api('/search?q=' + encodeURIComponent(i.value));
    d.innerHTML = [...r.candidates.map((c) => `<a data-go href="/candidates/${c.id}">👤 ${esc(c.name)} <span class="mut small">· ${esc(c.job_title)}</span></a>`), ...r.jobs.map((j) => `<a data-go href="/jobs">💼 ${esc(j.title)} <span class="mut small">· ${esc(j.department || '')}</span></a>`)].join('') || '<div class="mut small" style="padding:8px">No results</div>';
    d.style.display = 'block'; }, 250); };
  i.onblur = () => setTimeout(() => d.style.display = 'none', 200);
}

// ------------------------------------------------------------------ pages
const pages = {};
pages.login = () => {
  root.innerHTML = `<div class="login"><div class="l"><h1 style="color:#fff;font-size:40px">CareerBridge</h1><p style="font-size:18px;line-height:1.6">Recruitment Management Portal — post jobs, rank candidates with AI resume matching, schedule interviews and keep every applicant informed.</p><p class="small" style="opacity:.7">Leo Club of Hopeville · Community Connect · ORIGEN</p></div>
  <div class="r"><div class="card" style="width:400px">${roleTabs('Employer')}<h2 style="margin-top:0">Sign in</h2><form id="f"><label>Email</label><input class="in" name="email" value="sarah.jenkins@example.com"><label>Password</label><input class="in" type="password" name="password" value="demo1234">
  <button class="btn pri" style="width:100%;margin-top:16px">Sign in</button></form><p class="small mut">Demo: sarah.jenkins@example.com / demo1234</p><hr style="border:none;border-top:1px solid var(--line)">
  <details class="signup"><summary>New here? <b>Create an employer account</b></summary><form id="rf"><label>Organisation</label><input class="in" name="company" required><label>Your name</label><input class="in" name="name" required><label>Email</label><input class="in" name="email" type="email" required><label>Password</label><input class="in" name="password" type="password" minlength="6" required><button class="btn" style="width:100%;margin-top:12px">Create account</button></form></details></div></div></div>`;
  const done = (r) => { TOKEN = r.token; localStorage.setItem('cb_token', TOKEN); go('/'); };
  $('#f').onsubmit = async (e) => { e.preventDefault(); try { done(await api('/auth/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) })); } catch (x) { toast(x.message, 1); } };
  $('#rf').onsubmit = async (e) => { e.preventDefault(); try { done(await api('/auth/register', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) })); } catch (x) { toast(x.message, 1); } };
};

pages['/'] = async () => {
  const off = new Date(); off.setHours(0, 0, 0, 0); const end = new Date(off.getTime() + 86400000);
  const d = await api(`/dashboard?from=${off.toISOString()}&to=${end.toISOString()}`);
  const h = new Date().getHours(), greet = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
  const ch = d.apps_prev ? Math.round((d.apps_30 - d.apps_prev) / d.apps_prev * 100) : 100;
  const goal = Math.min(100, Math.round((d.hired + d.offers) / d.hiring_goal * 100));

   <div class="card"><span class="pill">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch)}% vs last month</span><div class="k" style="margin-top:10px">Total Applicants</div><div class="big">${d.applications}</div><div class="small mut">${d.apps_30} in the last 30 days</div></div>
   <div class="card"><span class="pill">pipeline</span><div class="k" style="margin-top:10px">Interviews</div><div class="big">${d.interviews}</div><div class="small mut">${d.today.length} scheduled today</div></div>
   <div class="card"><span class="pill">avg match ${Math.round(d.avg_match)}%</span><div class="k" style="margin-top:10px">Offers Sent</div><div class="big">${d.offers}</div><div class="small mut">${d.hired} hired</div></div></div>

   ${d.funnel.map((f, i) => `<div class="f"><div class="fb" style="width:${Math.max(18, f.count / max * 100)}%;background:${colors[i]};color:${i > 2 ? '#0a0a0a' : '#fff'}">0${i + 1} &nbsp; ${cap(f.stage)}</div><b>${f.count}</b>${i ? `<span class="small mut">${d.funnel[i - 1].count ? Math.round(f.count / d.funnel[i - 1].count * 100) : 0}% conversion</span>` : ''}</div>`).join('')}</div>

   ${d.today.length ? d.today.map((i) => `<div style="border-left:3px solid var(--g9);padding:8px 12px;margin:12px 0"><div class="small mut">🕑 ${fmtTime(i.scheduled_at)} · ${relTime(i.scheduled_at)}</div><b>${esc(i.type)}</b><div class="small">${esc(i.name)} · ${esc(i.job_title)}</div>

   <a data-go href="/interviews" class="btn" style="display:block;text-align:center;margin-top:10px">View Full Calendar</a></div></div>`;
};
function relTime(d) { const m = Math.round((new Date(d) - Date.now()) / 60000); if (m < -45) return 'done'; if (m <= 0) return 'now'; return m < 60 ? `in ${m}m` : `in ${Math.round(m / 60)} hours`; }
async function exportApps() { const rows = await api('/applications'); csv('candidates.csv', [['Name', 'Email', 'Job', 'Stage', 'Match', 'ATS', 'Source', 'Applied'], ...rows.map((r) => [r.name, r.email, r.job_title, r.stage, r.match_score, r.ats_score, r.source, r.created_at])]); }
function csv(name, rows) { const t = rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = name; a.click(); }

pages.jobForm = async (id) => {

      if (r.salary_min) { f.salary_min.value = r.salary_min; f.salary_max.value = r.salary_max; } toast('AI draft ready — review before publishing'); });

    if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 50);
  } catch (e) { toast(e.message, 1); if (!TOKEN) pages.login(); }
  finally { tb.className = 'done'; window.scrollTo(0, 0); if (window.matchMedia('(max-width:900px)').matches) toggleMenu(false); }
}
</script>

<script>
(async () => {
  const hide = isApp && !sessionStorage.getItem('cb_splash') ? showSplash() : null;
  sessionStorage.setItem('cb_splash', '1');
  const started = Date.now();
  await render();
  if (hide) setTimeout(hide, Math.max(0, 1500 - (Date.now() - started)));
  const pub = /^\/(careers|status)\//.test(location.pathname);
  if (isApp && !pub && !localStorage.getItem('cb_onboarded') && !localStorage.getItem('cb_token') && !localStorage.getItem('cb_stoken') && !localStorage.getItem('cb_utoken')) setTimeout(showOnboarding, hide ? 1300 : 0);
})();
</script>
