<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareerBridge – Recruitment Management Portal</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#123d30">
<link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CareerBridge"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#123d30;--g8:#1a4d3d;--g6:#2f6b55;--g1:#e3efe8;--mint:#c9ecd9;--bg:#f6f4ef;--side:#efece5;--beige:#e7e1d3;--card:#fff;--ink:#1d2622;--mut:#6b736e;--line:#e6e2d8;--red:#c0392b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.app{display:flex;min-height:100vh}.side{width:232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{font-weight:800;font-size:20px;color:var(--g9);padding:0 10px}.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#3c4741;cursor:pointer;font-weight:500}.nav:hover{background:#e8e4da}.nav.on{background:var(--beige);color:var(--g9);font-weight:700;box-shadow:inset -3px 0 0 var(--g9)}
.sec{font-size:10px;letter-spacing:.12em;color:var(--mut);margin:14px 12px 4px;font-weight:700}
.main{margin-left:232px;flex:1;min-width:0}.top{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:420px;position:relative}.search input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:#efece6}
.drop{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;padding:6px;display:none}.drop a{display:block;padding:7px 10px;border-radius:6px}.drop a:hover{background:var(--bg)}
.page{padding:26px 28px;max-width:1280px}h1{font-size:28px;margin:0 0 4px;color:var(--g9);font-weight:800}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.dark{background:var(--g9);color:#eaf5ef;border:none}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.k{font-size:11px;letter-spacing:.08em;color:var(--mut);font-weight:700;text-transform:uppercase}.big{font-size:30px;font-weight:800;margin:6px 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}.btn:hover{background:#f3f1ea}.pri{background:var(--g9);color:#fff;border-color:var(--g9)}.pri:hover{background:var(--g8)}.tan{background:var(--beige);border-color:var(--beige)}
.btn:disabled{opacity:.55;cursor:wait}.post{margin-top:auto;padding:12px;text-align:center}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:var(--g1);color:var(--g9)}
.st-applied{background:#e6eefb;color:#2952a3}.st-screening{background:#ddf2ee;color:#11695c}.st-shortlisted{background:#eee6fb;color:#6a3fb5}.st-interview{background:#fbe9de;color:#b2501a}.st-offer,.st-hired{background:#dff3e3;color:#1e7a3a}.st-rejected{background:#f7e1df;color:#a33}
.st-draft,.st-closed,.st-archived{background:#eee;color:#555}.st-paused{background:#f4ead2;color:#8a6d3b}
table{width:100%;border-collapse:collapse}th{font-size:11px;letter-spacing:.06em;color:var(--mut);text-align:left;padding:10px;border-bottom:1px solid var(--line);text-transform:uppercase}td{padding:11px 10px;border-bottom:1px solid #f0ede6}tr.click:hover td{background:#faf8f3;cursor:pointer}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.mut{color:var(--mut)}.small{font-size:12px}
.bar{height:8px;background:#ece9e1;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--g9)}
.funnel .f{display:flex;align-items:center;gap:12px;margin:6px 0}.funnel .fb{height:40px;border-radius:8px;display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:600;min-width:120px}
input.in,select.in,textarea.in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}label{font-size:12px;font-weight:700;color:#444;display:block;margin:10px 0 4px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g9);color:#fff;padding:12px 16px;border-radius:10px;z-index:60;max-width:380px}.toast.err{background:var(--red)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:3px 9px;margin:3px;font-size:12px;background:#faf9f5}.chip.ok{border-color:#9fd3b4;background:#eaf7ef}.chip.no{border-color:#efc2bd;background:#fbefed}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;max-width:80%}.msg.recruiter{background:var(--g1);margin-left:auto}.msg.candidate{background:#fff;border:1px solid var(--line)}.msg.system{background:transparent;color:var(--mut);font-size:12px;text-align:center;max-width:100%}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.login .l{background:var(--g9);color:#e5f3eb;padding:60px;display:flex;flex-direction:column;justify-content:center}.login .r{display:flex;align-items:center;justify-content:center;padding:30px}
.spark{display:flex;align-items:flex-end;gap:4px;height:46px}.spark i{flex:1;background:#d7e6dd;border-radius:3px}.spark i:last-child{background:var(--g9)}
.md h3{margin:12px 0 6px}.md ul{padding-left:18px}
#menuBtn,#installBtn{display:none}.shade{display:none}
@media(max-width:900px){.side{display:flex;transform:translateX(-100%);transition:transform .2s;z-index:40;width:260px;box-shadow:0 0 30px #0003}.side.open{transform:none}.shade.open{display:block;position:fixed;inset:0;background:#0005;z-index:30}
#menuBtn{display:inline-flex;font-size:22px;background:none;border:none;padding:4px 8px;cursor:pointer}.top{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}.top .small,.top a.row>div{display:none}.search{max-width:none;flex:1}.top>div[style*='flex:1']{display:none}.page{overflow-x:hidden}.card{overflow-wrap:anywhere}
h1{font-size:23px}.big{font-size:24px}table{display:block;overflow-x:auto;white-space:nowrap}.modal .card{max-height:85vh}.row.wrap>.in{width:100%!important}.main{margin-left:0}.g4,.g3,.g2,.g21,.login{grid-template-columns:1fr}.login .l{display:none}.page{padding:18px 16px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STAGES = ['applied', 'screening', 'shortlisted', 'interview', 'offer', 'hired', 'rejected'];
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : '';
const fmtDate = (d) => d ? new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtTime = (d) => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDT = (d) => `${fmtDate(d)}, ${fmtTime(d)}`;
const money = (n) => n ? '₹' + (n >= 100000 ? (n / 100000).toFixed(1).replace('.0', '') + 'L' : n.toLocaleString('en-IN')) : '—';
const initials = (n) => String(n || '?').split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const av = (n, c, s = 34) => `<span class="av" style="background:${c || '#2f6b55'};width:${s}px;height:${s}px;font-size:${s / 2.6}px">${esc(initials(n))}</span>`;
const pill = (s) => `<span class="pill st-${s}">${esc(cap(s))}</span>`;
const ico = { dash: '▦', jobs: '💼', cand: '👥', int: '📅', msg: '💬', ana: '📈', rep: '📄', co: '🏢', rec: '🧑‍💼', bell: '🔔', set: '⚙️', help: '❓' };

let TOKEN = localStorage.getItem('cb_token'), ME = null;
async function api(path, opts = {}) {
  const headers = { ...(opts.body && !(opts.body instanceof FormData) ? { 'content-type': 'application/json' } : {}), ...(TOKEN ? { authorization: 'Bearer ' + TOKEN } : {}) };
  const res = await fetch('/api' + path, { ...opts, headers, body: opts.body && !(opts.body instanceof FormData) ? JSON.stringify(opts.body) : opts.body });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && !path.startsWith('/auth')) { logout(); throw new Error('Please sign in'); }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3000); }
function go(p) { history.pushState({}, '', p); render(); }
window.onpopstate = render;
document.addEventListener('click', (e) => { const a = e.target.closest('a[data-go]'); if (a) { e.preventDefault(); go(a.getAttribute('href')); } });
function logout() { localStorage.removeItem('cb_token'); TOKEN = null; ME = null; go('/login'); }
async function busy(btn, fn) { const t = btn.textContent; btn.disabled = true; btn.textContent = '⏳ Working…'; try { await fn(); } catch (e) { toast(e.message, 1); } finally { btn.disabled = false; btn.textContent = t; } }
function modal(html, onMount) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="card">${html}</div>`; m.onclick = (e) => { if (e.target === m) m.remove(); }; document.body.appendChild(m); onMount && onMount(m); return m; }

const NAV = [['/', 'dash', 'Dashboard'], ['/jobs', 'jobs', 'Jobs'], ['/candidates', 'cand', 'Candidates'], ['/interviews', 'int', 'Interviews'], ['/messages', 'msg', 'Messaging'], ['/analytics', 'ana', 'Analytics'], ['/reports', 'rep', 'Reports'],
  null, ['/company', 'co', 'Company'], ['/recruiters', 'rec', 'Recruiters'], ['/notifications', 'bell', 'Notifications'], ['/settings', 'set', 'Settings']];

function shell(active, body) {
  return `<div class="app"><aside class="side"><div class="brand">CareerBridge<small>Employer Portal</small></div><div style="height:18px"></div>
  ${NAV.map((n) => n ? `<a data-go href="${n[0]}" class="nav ${active === n[0] ? 'on' : ''}"><span>${ico[n[1]]}</span>${n[2]}</a>` : '<div class="sec">ORGANIZATION</div>').join('')}
  <div style="height:12px"></div><a data-go href="/help" class="nav ${active === '/help' ? 'on' : ''}">${ico.help} Help Center</a><a class="nav" style="color:var(--red)" onclick="logout()">↪ Log Out</a>
  <a data-go href="/jobs/new" class="btn pri post">＋ Post a New Job</a></aside>
  <div class="shade" onclick="toggleMenu(false)"></div><div class="main"><div class="top"><button id="menuBtn" onclick="toggleMenu()" aria-label="Menu">☰</button><div class="search"><input id="gs" placeholder="Search candidates, jobs…" autocomplete="off"><div class="drop" id="gsd"></div></div><div style="flex:1"></div>
  <button id="installBtn" class="btn pri small" onclick="installApp()">⬇ Install app</button><a data-go href="/notifications" title="Notifications" style="font-size:18px">🔔</a><a data-go href="/profile" class="row"><div style="text-align:right"><b>${esc(ME.user.name)}</b><div class="small mut">${esc(ME.user.title || '')} · ${esc(ME.company.name)}</div></div>${av(ME.user.name, '#123d30', 36)}</a></div>
  <div class="page" id="page">${body}</div></div></div>`;
}
function bindSearch() {
  const i = $('#gs'), d = $('#gsd'); if (!i) return; let t;
  i.oninput = () => { clearTimeout(t); t = setTimeout(async () => { if (!i.value.trim()) return d.style.display = 'none'; const r = await api('/search?q=' + encodeURIComponent(i.value));
    d.innerHTML = [...r.candidates.map((c) => `<a data-go href="/candidates/${c.id}">👤 ${esc(c.name)} <span class="mut small">· ${esc(c.job_title)}</span></a>`), ...r.jobs.map((j) => `<a data-go href="/jobs">💼 ${esc(j.title)} <span class="mut small">· ${esc(j.department || '')}</span></a>`)].join('') || '<div class="mut small" style="padding:8px">No results</div>';
    d.style.display = 'block'; }, 250); };
  i.onblur = () => setTimeout(() => d.style.display = 'none', 200);
}

// ------------------------------------------------------------------ pages
const pages = {};
pages.login = () => {
  root.innerHTML = `<div class="login"><div class="l"><h1 style="color:#fff;font-size:40px">CareerBridge</h1><p style="font-size:18px;line-height:1.6">Recruitment Management Portal — post jobs, rank candidates with AI resume matching, schedule interviews and keep every applicant informed.</p><p class="small" style="opacity:.7">Leo Club of Hopeville · Community Connect · ORIGEN</p></div>
  <div class="r"><div class="card" style="width:400px">${roleTabs('Employer')}<h2 style="margin-top:0">Sign in</h2><form id="f"><label>Email</label><input class="in" name="email" value="sarah.jenkins@example.com"><label>Password</label><input class="in" type="password" name="password" value="demo1234">
  <button class="btn pri" style="width:100%;margin-top:16px">Sign in</button></form><p class="small mut">Demo: sarah.jenkins@example.com / demo1234</p><hr style="border:none;border-top:1px solid var(--line)">
  <details><summary class="small" style="cursor:pointer">Register a new organisation</summary><form id="rf"><label>Organisation</label><input class="in" name="company" required><label>Your name</label><input class="in" name="name" required><label>Email</label><input class="in" name="email" type="email" required><label>Password</label><input class="in" name="password" type="password" minlength="6" required><button class="btn" style="width:100%;margin-top:12px">Create account</button></form></details></div></div></div>`;
  const done = (r) => { TOKEN = r.token; localStorage.setItem('cb_token', TOKEN); go('/'); };
  $('#f').onsubmit = async (e) => { e.preventDefault(); try { done(await api('/auth/login', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) })); } catch (x) { toast(x.message, 1); } };
  $('#rf').onsubmit = async (e) => { e.preventDefault(); try { done(await api('/auth/register', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) })); } catch (x) { toast(x.message, 1); } };
};

pages['/'] = async () => {
  const off = new Date(); off.setHours(0, 0, 0, 0); const end = new Date(off.getTime() + 86400000);
  const d = await api(`/dashboard?from=${off.toISOString()}&to=${end.toISOString()}`);
  const h = new Date().getHours(), greet = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
  const ch = d.apps_prev ? Math.round((d.apps_30 - d.apps_prev) / d.apps_prev * 100) : 100;
  const goal = Math.min(100, Math.round((d.hired + d.offers) / d.hiring_goal * 100));
  const colors = ['#123d30', '#3f6e5c', '#6f9283', '#a7bdb3', '#d9e3dd'];
  const max = d.funnel[0].count || 1;
  return `<div class="row between wrap"><div><h1>${greet}, ${esc(ME.user.name.split(' ')[0])}</h1>
  <p class="sub" style="margin:0">You currently have <b>${d.active_jobs} Active Jobs</b>, <b>${d.applications} Applications</b>, <b>${d.interviews} Interviews</b>, and <b>${d.offers} Offers</b>.<br>Priority for today: ${esc(d.priority)}</p>
  <p class="small mut">📅 ${new Date().toDateString()} · <b>${esc(d.location || 'HQ Office')}</b></p></div>
  <div class="card row" style="gap:6px"><a data-go href="/jobs/new" class="btn">＋ Post Job</a><a data-go href="/recruiters" class="btn">Invite</a><a data-go href="/candidates" class="btn">Schedule</a><button class="btn" onclick="exportApps()">Export</button></div></div>
  <div class="card row" style="margin:14px 0;padding:10px 16px;width:fit-content"><span class="k">Hiring goal progress</span><div class="bar" style="width:160px"><i style="width:${goal}%"></i></div><b>${goal}% Reached</b></div>
  <div class="grid g4">
   <div class="card"><span class="pill">active</span><div class="k" style="margin-top:10px">Active Jobs</div><div class="big">${d.active_jobs}</div><div class="small mut">Published and accepting applications</div></div>
   <div class="card"><span class="pill">${ch >= 0 ? '▲' : '▼'} ${Math.abs(ch)}% vs last month</span><div class="k" style="margin-top:10px">Total Applicants</div><div class="big">${d.applications}</div><div class="small mut">${d.apps_30} in the last 30 days</div></div>
   <div class="card"><span class="pill">pipeline</span><div class="k" style="margin-top:10px">Interviews</div><div class="big">${d.interviews}</div><div class="small mut">${d.today.length} scheduled today</div></div>
   <div class="card"><span class="pill">avg match ${Math.round(d.avg_match)}%</span><div class="k" style="margin-top:10px">Offers Sent</div><div class="big">${d.offers}</div><div class="small mut">${d.hired} hired</div></div></div>
  <div class="grid g21" style="margin-top:16px"><div class="card funnel"><b>Recruitment Funnel</b><div class="small mut" style="margin-bottom:8px">Overall conversion across all roles</div>
   ${d.funnel.map((f, i) => `<div class="f"><div class="fb" style="width:${Math.max(18, f.count / max * 100)}%;background:${colors[i]};color:${i > 2 ? '#123d30' : '#fff'}">0${i + 1} &nbsp; ${cap(f.stage)}</div><b>${f.count}</b>${i ? `<span class="small mut">${d.funnel[i - 1].count ? Math.round(f.count / d.funnel[i - 1].count * 100) : 0}% conversion</span>` : ''}</div>`).join('')}</div>
   <div class="card"><div class="row between"><b>Upcoming Today</b><span class="pill st-rejected">Live</span></div>
   ${d.today.length ? d.today.map((i) => `<div style="border-left:3px solid var(--g9);padding:8px 12px;margin:12px 0"><div class="small mut">🕑 ${fmtTime(i.scheduled_at)} · ${relTime(i.scheduled_at)}</div><b>${esc(i.type)}</b><div class="small">${esc(i.name)} · ${esc(i.job_title)}</div>
   <div class="row" style="margin-top:8px">${i.meeting_link ? `<a class="btn pri" target="_blank" href="${esc(i.meeting_link)}">Join Meet</a>` : ''}<a data-go class="btn" href="/candidates/${i.app_id}">Open</a></div></div>`).join('') : '<p class="mut">No interviews today.</p>'}
   <a data-go href="/interviews" class="btn" style="display:block;text-align:center;margin-top:10px">View Full Calendar</a></div></div>`;
};
function relTime(d) { const m = Math.round((new Date(d) - Date.now()) / 60000); if (m < -45) return 'done'; if (m <= 0) return 'now'; return m < 60 ? `in ${m}m` : `in ${Math.round(m / 60)} hours`; }
async function exportApps() { const rows = await api('/applications'); csv('candidates.csv', [['Name', 'Email', 'Job', 'Stage', 'Match', 'ATS', 'Source', 'Applied'], ...rows.map((r) => [r.name, r.email, r.job_title, r.stage, r.match_score, r.ats_score, r.source, r.created_at])]); }
function csv(name, rows) { const t = rows.map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = name; a.click(); }

pages['/jobs'] = async () => {
  const jobs = await api('/jobs'); window._jobs = jobs;
  const cnt = (s) => jobs.filter((j) => j.status === s).length;
  const apps = jobs.reduce((a, j) => a + j.applicants, 0);
  const avgM = Math.round(jobs.filter((j) => j.avg_match).reduce((a, j) => a + j.avg_match, 0) / (jobs.filter((j) => j.avg_match).length || 1));
  return `<div class="row between wrap"><div><h1>Jobs Management</h1><p class="sub">Manage, monitor, publish, and optimize all job postings across your organization.</p></div>
  <div class="row"><button class="btn" onclick="csv('jobs.csv',[['Title','Department','Location','Status','Applicants','Avg match'],..._jobs.map(j=>[j.title,j.department,j.location,j.status,j.applicants,j.avg_match])])">⬇ Export Jobs</button><a data-go href="/jobs/new" class="btn pri">＋ Post Job</a></div></div>
  <div class="grid" style="grid-template-columns:repeat(6,1fr)">${[['Total Jobs', jobs.length], ['Published', cnt('published')], ['Draft', cnt('draft')], ['Closed', cnt('closed')], ['Applicants', apps], ['AI Match', avgM + '%']].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="big" style="font-size:24px">${v}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:16px;padding:6px"><table><tr><th>Title & Dept</th><th>Recruiter</th><th>Applicants</th><th>AI Match</th><th>Status</th><th></th></tr>
  ${jobs.map((j) => `<tr><td><a data-go href="/jobs/${j.id}"><b>${esc(j.title)}</b></a>${j.is_urgent ? ' <span class="pill st-rejected">Urgent</span>' : ''}<div class="small mut">${esc(j.department || '')} · ${esc(j.location || '')}</div></td><td>${esc(j.recruiter_name || '')}</td>
  <td><a data-go href="/candidates?job=${j.id}"><b>${j.applicants}</b></a></td><td>✦ ${j.avg_match ?? '—'}%</td><td>${pill(j.status)}</td>

setInterval(() => { const el = $('#cd'); const i = (window._ints || []).filter((x) => x.status === 'scheduled' && new Date(x.scheduled_at) > Date.now()).sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at))[0]; if (el && i) { const s = Math.floor((new Date(i.scheduled_at) - Date.now()) / 1000); el.textContent = `Starting in ${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m ${s % 60}s`; } }, 1000);

  <div class="card dark"><b>✦ AI Recruitment Insights</b>${ins ? `<div class="k" style="color:#9fd3b4;margin-top:12px">Suggested salary range</div><div class="big" style="font-size:22px">${esc(ins.currency || '')} ${Number(ins.salary_min).toLocaleString()} – ${Number(ins.salary_max).toLocaleString()}</div><p class="small">${esc(ins.salary_note)}</p><div class="k" style="color:#9fd3b4">Market competition</div><p>${esc(ins.competition)} — ${esc(ins.competition_note)}</p><ul>${(ins.posting_tips || []).map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p class="small">Click “AI insights” to get a salary estimate, competition level and posting tips.</p>'}</div></div>`;
};
async function dropStage(e, stage) { e.preventDefault(); const id = e.dataTransfer.getData('id'); if (!id) return; try { await api(`/applications/${id}/stage`, { method: 'PATCH', body: { stage } }); toast('Moved to ' + stage + ' — candidate informed'); render(); } catch (x) { toast(x.message, 1); } }

pages['/profile'] = async () => {
  setTimeout(() => {
    $('#pf').onsubmit = (e) => { e.preventDefault(); busy(e.submitter, async () => { await api('/me', { method: 'PUT', body: Object.fromEntries(new FormData(e.target)) }); ME = null; toast('Profile saved'); render(); }); };
    $('#pw').onsubmit = (e) => { e.preventDefault(); const b = Object.fromEntries(new FormData(e.target)); if (b.next !== b.confirm) return toast('New passwords do not match', 1); busy(e.submitter, async () => { await api('/me/password', { method: 'POST', body: b }); e.target.reset(); toast('Password changed'); }); };
  });
  const u = ME.user;
  return `<h1>My Profile</h1><p class="sub">Your account details and password.</p><div class="grid g2"><form id="pf" class="card"><div class="row" style="margin-bottom:8px">${av(u.name, '#123d30', 56)}<div><b>${esc(u.name)}</b><div class="small mut">${esc(u.email)} · ${esc(u.role)}</div></div></div>
  <label>Full name</label><input class="in" name="name" value="${esc(u.name)}" required><label>Job title</label><input class="in" name="title" value="${esc(u.title || '')}"><label>Phone</label><input class="in" name="phone"><button class="btn pri" style="margin-top:12px">Save profile</button></form>
  <form id="pw" class="card"><h3 style="margin-top:0">Change password</h3><label>Current password</label><input class="in" type="password" name="current" required><label>New password</label><input class="in" type="password" name="next" minlength="6" required><label>Confirm new password</label><input class="in" type="password" name="confirm" minlength="6" required><button class="btn pri" style="margin-top:12px">Change password</button>
  <p class="small mut">Forgot your password? Ask your organisation admin to reset it from the Recruiters page.</p></form></div>`;
};
pages.notFound = async () => `<div class="card" style="text-align:center;padding:60px"><div style="font-size:60px">🧭</div><h1>Page not found</h1><p class="sub">This page doesn't exist or was moved.</p><a data-go href="/" class="btn pri">Back to Dashboard</a></div>`;

// ---------------------------------------------------------------- public pages
async function careers(slug, jobId) {
  let c; try { c = await api('/public/' + slug); } catch (e) { root.innerHTML = `<div class="card" style="max-width:520px;margin:80px auto;text-align:center"><h1>Careers page not found</h1><p class="sub">Check the link you were given.</p></div>`; return; } document.title = c.name + ' – Careers';
  const j = jobId && c.jobs.find((x) => x.id == jobId);
  root.innerHTML = `<div style="background:var(--g9);color:#fff;padding:36px 24px"><div style="max-width:900px;margin:auto"><div class="small" style="opacity:.7">Careers at</div><h1 style="color:#fff;font-size:36px">${esc(c.name)}</h1><p>${esc(c.about || '')}</p></div></div>
  <div style="max-width:900px;margin:24px auto;padding:0 16px">${j ? `<a href="/careers/${slug}" data-go class="small">← All jobs</a><div class="card" style="margin-top:12px"><h2 style="margin-top:0">${esc(j.title)}</h2><p class="mut">${esc(j.department || '')} · ${esc(j.location || '')} · ${esc(j.work_mode || '')} · ${esc(j.employment_type || '')}</p>
   <p style="white-space:pre-wrap">${esc(j.description || '')}</p><h3>Requirements</h3><p style="white-space:pre-wrap">${esc(j.requirements || '')}</p><div>${j.skills.map((s) => `<span class="chip">${esc(s)}</span>`).join('')}</div></div>
   <form id="apf" class="card" style="margin-top:16px"><h2 style="margin-top:0">Apply for this job</h2><div class="grid g2"><div><label>Full name *</label><input class="in" name="name" required></div><div><label>Email *</label><input class="in" type="email" name="email" required></div><div><label>Phone</label><input class="in" name="phone"></div><div><label>City</label><input class="in" name="location"></div><div><label>LinkedIn</label><input class="in" name="linkedin"></div><div><label>Notice period / availability</label><input class="in" name="availability"></div></div>
   <label>Resume (PDF, DOCX or TXT, max 5 MB) *</label><input class="in" type="file" name="resume" accept=".pdf,.docx,.txt" required><label>Cover note</label><textarea class="in" name="cover_letter" rows="3"></textarea>
   <p class="small mut">Your resume is assessed on job-relevant skills only. A recruiter makes the final decision.</p><button class="btn pri">Submit application</button></form>`
   : `<h2>Open positions (${c.jobs.length})</h2>${c.jobs.map((x) => `<a data-go href="/careers/${slug}/${x.id}" class="card row between" style="margin:10px 0"><div><b>${esc(x.title)}</b><div class="small mut">${esc(x.department || '')} · ${esc(x.location || '')} · ${esc(x.work_mode || '')}</div></div><span class="btn pri">Apply →</span></a>`).join('') || '<p class="mut">No open roles right now.</p>'}`}
  <p class="small mut" style="text-align:center;margin-top:30px">Powered by CareerBridge</p></div>`;
  const f = $('#apf'); if (f) f.onsubmit = (e) => { e.preventDefault(); busy(e.submitter, async () => { const r = await api(`/public/${slug}/jobs/${jobId}/apply`, { method: 'POST', body: new FormData(f) }); go('/status/' + r.token); }); };
}
async function status(token) {
  let a; try { a = await api('/status/' + token); } catch (e) { root.innerHTML = `<div class="card" style="max-width:520px;margin:80px auto;text-align:center"><h1>Application not found</h1><p class="sub">Use the private status link you received after applying.</p></div>`; return; } const idx = ['applied', 'screening', 'shortlisted', 'interview', 'offer'].indexOf(a.stage === 'hired' ? 'offer' : a.stage);
  root.innerHTML = `<div style="max-width:760px;margin:30px auto;padding:0 16px"><div class="card"><div class="small mut">${esc(a.company)} · Application status</div><h1>${esc(a.job_title)}</h1><p>Hi ${esc(a.name)}, thanks for applying on ${fmtDate(a.created_at)}. Bookmark this page to follow your application.</p>
  ${a.stage === 'rejected' ? '<p class="pill st-rejected">This application is closed. Thank you for your interest.</p>' : `<div class="row" style="gap:4px;margin:16px 0">${['Applied', 'Screening', 'Shortlisted', 'Interview', 'Offer'].map((s, i) => `<div style="flex:1;text-align:center"><div style="height:8px;border-radius:4px;background:${i <= idx ? 'var(--g9)' : 'var(--line)'}"></div><div class="small" style="margin-top:6px;${i === idx ? 'font-weight:800' : ''}">${s}</div></div>`).join('')}</div>`}
  ${a.interviews.map((i) => `<div class="card dark" style="margin:10px 0"><b>📅 ${esc(i.type)}</b><div>${fmtDT(i.scheduled_at)} · ${esc(i.platform)}</div>${i.meeting_link ? `<a class="btn" style="margin-top:8px;display:inline-block" target="_blank" href="${esc(i.meeting_link)}">Join meeting</a>` : ''}${i.location ? `<div>${esc(i.location)}</div>` : ''}</div>`).join('')}</div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Messages</h3>${a.messages.map((m) => `<div class="msg ${m.sender_type === 'candidate' ? 'recruiter' : m.sender_type === 'system' ? 'system' : 'candidate'}">${m.sender_type === 'recruiter' ? `<div class="small mut">${esc(a.company)} · ${fmtDT(m.sent_at)}</div>` : ''}${esc(m.body)}</div>`).join('') || '<p class="mut">No messages yet.</p>'}
  <textarea class="in" id="rb" rows="3" placeholder="Reply to the hiring team…"></textarea><button class="btn pri" style="margin-top:8px" onclick="busy(this,async()=>{await api('/status/${token}/messages',{method:'POST',body:{body:$('#rb').value}});toast('Sent');status('${token}')})">Send reply</button></div></div>`;
}

// ---------------------------------------------------------------- router
const root = $('#root');
function toggleMenu(force) { const o = force ?? !$('.side')?.classList.contains('open'); $('.side')?.classList.toggle('open', o); $('.shade')?.classList.toggle('open', o); }
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; const b = $('#installBtn'); if (b) b.style.display = 'inline-flex'; });
async function installApp() { if (!deferredInstall) return toast('On iPhone: Share → Add to Home Screen. On Android: Chrome ⋮ → Install app.'); deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#installBtn').style.display = 'none'; }
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
async function render() {
  const p = location.pathname; let m;
  try {
    if ((m = p.match(/^\/careers\/([^/]+)(?:\/(\d+))?/))) return careers(m[1], m[2]);
    if ((m = p.match(/^\/status\/([^/]+)/))) return status(m[1]);
    if (p.startsWith('/student')) return studentRender(p);
    if (p.startsWith('/university')) return uniRender(p);
    if (p === '/login' || !TOKEN) return pages.login();
    if (!ME) ME = await api('/me');
    let body, active = p;
    if ((m = p.match(/^\/candidates\/(\d+)/))) { body = await pages.candidate(m[1]); active = '/candidates'; }
    else if (p === '/jobs/new') { body = await pages.jobForm(); active = '/jobs'; }
    else if ((m = p.match(/^\/jobs\/(\d+)\/edit/))) { body = await pages.jobForm(m[1]); active = '/jobs'; }
    else if ((m = p.match(/^\/jobs\/(\d+)$/))) { body = await pages.job(m[1]); active = '/jobs'; }
    else body = await (pages[p] || pages.notFound)();
    root.innerHTML = shell(active, body); bindSearch(); if (deferredInstall) $('#installBtn').style.display = 'inline-flex';
    if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 50);
  } catch (e) { toast(e.message, 1); if (!TOKEN) pages.login(); }
}
</script>
<script src="/portals.js"></script>
<script>render();</script>
</body>
</html>
